# Keeps the free Supabase project from pausing by pinging the database every 6 hours.
# Optional secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY — if unset, values from assets/js/config.js are used.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # only used to keep this schedule alive (see last step)

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keep-alive.mjs

      # GitHub disables scheduled workflows in repositories with no commits for
      # 60 days. If the repo has been quiet for 45+ days, push a tiny timestamp
      # commit so this schedule (and therefore your database) keeps running.
      - name: Keep the schedule itself active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-stamp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-stamp
            git commit -m "chore: keep scheduled database ping active"
            git push
          fi
